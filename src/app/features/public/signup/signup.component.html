<main class="min-h-screen bg-[#FBF8F1] text-[#1C1A17] relative flex items-center justify-center py-12 px-4 overflow-hidden">
  <!-- Background Hero Banner Image -->
  <div class="absolute inset-0 hero-bg z-0 animate-image-entrance"></div>

  <div class="w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop grid grid-cols-1 lg:grid-cols-12 gap-12 items-center relative z-10">
    
    <!-- Left Side: Copy -->
    <div class="lg:col-span-7 text-[#FBF8F1] max-w-[520px] mx-auto lg:mx-0 text-center lg:text-left space-y-6">
      <span class="text-[12.5px] tracking-[2.5px] uppercase text-[#E8C468] font-semibold block">
        Start Creating
      </span>
      <h1 class="playfair font-bold text-4xl md:text-5xl lg:text-6xl leading-[1.08]">
        Find your workbench, <em class="italic font-semibold text-[#E8C468]">creator.</em>
      </h1>
      <p class="text-[16px] leading-[1.6] text-[#E9E3D5] max-w-[400px] mx-auto lg:mx-0">
        Learn the secrets of traditional Lippan Art, Mosaic patterns, and modern Resin crafting from master artisans.
      </p>
    </div>

    <!-- Right Side: Index Card Form -->
    <div class="lg:col-span-5 flex justify-center lg:justify-end">
      <div class="index-card p-9 md:p-10">
        <div class="card-tape"></div>
        <div class="flex items-center gap-3 mt-2 mb-1">
          <img src="/logo.png" alt="Lemon Academia Logo" class="w-10 h-10 rounded-full object-cover shadow-xs" />
          <h2 class="playfair font-bold text-[27px]">Create Account</h2>
        </div>
        <p class="text-[13.5px] text-[#5B5650] mb-6">Join Lemon Academy and start creating today.</p>

        @if (error()) {
          <div class="bg-red-50 border border-red-200 text-red-700 text-xs rounded p-2.5 mb-4">
            {{ error() }}
          </div>
        }

        <form (ngSubmit)="handleSignup()" class="space-y-5">
          <div class="space-y-[6px]">
            <label class="block text-[11.5px] font-semibold tracking-[0.6px] uppercase text-[#5B5650]">
              Full name
            </label>
            <input 
              type="text" 
              placeholder="John Doe"
              class="w-full py-2 bg-transparent border-b-[1.5px] border-[#E7E1D3] font-body-md text-[15px] text-[#1C1A17] outline-none focus:border-[#8B6914] transition-all placeholder-[#C2BAA5]"
              [ngModel]="name()"
              (ngModelChange)="name.set($event)"
              name="name"
              required
            />
          </div>

          <div class="space-y-[6px]">
            <label class="block text-[11.5px] font-semibold tracking-[0.6px] uppercase text-[#5B5650]">
              Email address
            </label>
            <input 
              type="email" 
              placeholder="you@example.com"
              class="w-full py-2 bg-transparent border-b-[1.5px] border-[#E7E1D3] font-body-md text-[15px] text-[#1C1A17] outline-none focus:border-[#8B6914] transition-all placeholder-[#C2BAA5]"
              [ngModel]="email()"
              (ngModelChange)="email.set($event)"
              name="email"
              required
            />
          </div>

          <div class="space-y-[6px]">
            <label class="block text-[11.5px] font-semibold tracking-[0.6px] uppercase text-[#5B5650]">
              Password
            </label>
            <input 
              type="password" 
              placeholder="••••••••"
              class="w-full py-2 bg-transparent border-b-[1.5px] border-[#E7E1D3] font-body-md text-[15px] text-[#1C1A17] outline-none focus:border-[#8B6914] transition-all placeholder-[#C2BAA5]"
              [ngModel]="password()"
              (ngModelChange)="password.set($event)"
              name="password"
              required
            />
          </div>

          <button 
            type="submit" 
            [disabled]="loading()"
            class="w-full py-[14px] border-none rounded-[4px] bg-[#6E5410] text-white font-semibold text-[14.5px] tracking-[0.3px] cursor-pointer hover:bg-[#5c4610] active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-4 disabled:opacity-50">
            {{ loading() ? 'Creating Account...' : 'Sign Up' }}
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </form>

        <p class="text-center text-[13px] text-[#5B5650] mt-[20px]">
          Already have an account?
          <a routerLink="/login" class="font-semibold text-[#6E5410] hover:underline">
            Log In
          </a>
        </p>
      </div>
    </div>
  </div>
</main>
