<div class="min-h-screen bg-neutral-900 text-neutral-100 flex items-center justify-center p-4 sm:p-6 lg:p-8">
  <div class="max-w-md w-full">
    <!-- Header Logo / Icon -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-amber-400/10 border border-amber-400/20 text-amber-400 mb-4 shadow-lg">
        <span class="material-symbols-outlined text-3xl">lock_reset</span>
      </div>
      <h1 class="text-2xl sm:text-3xl font-black text-white">Reset Your Password</h1>
      <p class="text-neutral-400 text-sm mt-1">Create a new secure password for your Lemon Academia account.</p>
    </div>

    <!-- Success Card -->
    <div *ngIf="isSuccess()" class="bg-emerald-500/10 border border-emerald-500/30 rounded-3xl p-8 text-center space-y-4 animate-fadeIn">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-emerald-500/20 text-emerald-400">
        <span class="material-symbols-outlined text-2xl">check_circle</span>
      </div>
      <h3 class="text-xl font-bold text-emerald-400">Password Changed Successfully!</h3>
      <p class="text-sm text-neutral-300">
        Your password has been updated. Redirecting you to the login screen in a few seconds...
      </p>
      <div class="pt-2">
        <a routerLink="/login" class="inline-flex items-center gap-2 px-6 py-2.5 rounded-xl bg-amber-400 text-neutral-950 font-bold hover:brightness-110">
          <span>Go to Login</span>
          <span class="material-symbols-outlined text-base">arrow_forward</span>
        </a>
      </div>
    </div>

    <!-- Form Card -->
    <div *ngIf="!isSuccess()" class="bg-neutral-800/80 border border-neutral-700/60 rounded-3xl p-6 sm:p-8 backdrop-blur-xl shadow-2xl">
      <!-- Error Message -->
      <div *ngIf="errorMessage()" class="mb-5 p-3.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs sm:text-sm flex items-center gap-2">
        <span class="material-symbols-outlined text-lg shrink-0">error</span>
        <span>{{ errorMessage() }}</span>
      </div>

      <form (ngSubmit)="submitReset()" class="space-y-4">
        <!-- Token input if not provided in URL -->
        <div *ngIf="!token()" class="space-y-1">
          <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-400">
            Reset Token
          </label>
          <input
            type="text"
            [(ngModel)]="token"
            name="token"
            required
            placeholder="Paste reset token from email"
            class="w-full px-4 py-3 bg-neutral-900 border border-neutral-700 rounded-xl text-white placeholder-neutral-500 focus:outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-400/20 text-sm"
          />
        </div>

        <div class="space-y-1">
          <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-400">
            New Password
          </label>
          <div class="relative">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              [(ngModel)]="newPassword"
              name="newPassword"
              required
              placeholder="Minimum 6 characters"
              class="w-full pl-4 pr-11 py-3 bg-neutral-900 border border-neutral-700 rounded-xl text-white placeholder-neutral-500 focus:outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-400/20 text-sm"
            />
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-400 hover:text-white"
            >
              <span class="material-symbols-outlined text-lg">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
            </button>
          </div>
        </div>

        <div class="space-y-1">
          <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-400">
            Confirm New Password
          </label>
          <input
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            required
            placeholder="Re-enter new password"
            class="w-full px-4 py-3 bg-neutral-900 border border-neutral-700 rounded-xl text-white placeholder-neutral-500 focus:outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-400/20 text-sm"
          />
        </div>

        <button
          type="submit"
          [disabled]="isLoading()"
          class="w-full mt-6 py-3.5 rounded-xl font-bold bg-gradient-to-r from-amber-400 to-yellow-500 text-neutral-950 hover:brightness-110 active:scale-[0.99] transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-amber-400/20 disabled:opacity-50"
        >
          <span *ngIf="isLoading()" class="material-symbols-outlined animate-spin text-lg">progress_activity</span>
          <span>{{ isLoading() ? 'Resetting Password...' : 'Save New Password' }}</span>
        </button>

        <div class="text-center pt-3">
          <a routerLink="/login" class="text-xs text-neutral-400 hover:text-amber-400 transition">
            Back to Sign In
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
